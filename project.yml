name: Amp
options:
  bundleIdPrefix: com.amp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    AMP_RELEASE_TAG: "v1.1.0"
packages:
  Ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    revision: 48cbf24e7fb5d329b1f5e24cd2e5b048585ff770
  Opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    revision: 8e23828b9d88f0ff1ff2d7c4bcb65739a4bdeff8
  Vorbis:
    url: https://github.com/sbooth/vorbis-binary-xcframework
    revision: 842020eabcebe410e698c68545d6597b2d232e51
targets:
  Amp:
    type: application
    platform: iOS
    sources:
      - path: Amp
        excludes: [Resources/Vybe]
      - path: WidgetShared
    dependencies:
      - target: AmpPlayerWidget
        embed: true
      - package: Ogg
        product: ogg
      - package: Opus
        product: opus
      - package: Vorbis
        product: vorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amp
        CODE_SIGN_ENTITLEMENTS: Support/Amp.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Support/Amp-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    scheme:
      testTargets:
        - AmpTests
        - AmpInteractionTests
  AmpTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AmpTests]
    dependencies:
      - target: Amp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AmpInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AmpInteractionTests]
    dependencies:
      - target: Amp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Amp

  AmpPlayerWidget:
    type: app-extension
    platform: iOS
    sources: [AmpPlayerWidget, WidgetShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amp.playerwidget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AMP_WIDGET_EXTENSION"
        INFOPLIST_FILE: Support/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Support/AmpPlayerWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
