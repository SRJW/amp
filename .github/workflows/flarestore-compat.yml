name: FlareStore compatibility IPA
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: iOS workflow run whose device build succeeded
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: flarestore-compat-${{ inputs.source_run }}
  cancel-in-progress: false
jobs:
  patch:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      IPAPATCH_REVISION: 2ccafe4035bcf9fdade17cf32605d532da6cea6a
      IPAPATCH_DYLIB_SHA256: cd903ea15657cbd356398adcb60c8872c41c29b69acc1a5dfb78a49d6e75dea5
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the original successful device build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > source-jobs.json
          python3 - <<'PY'
          import json, os, re
          source = json.load(open('source-run.json'))
          jobs = json.load(open('source-jobs.json'))['jobs']
          assert source['repository']['full_name'] == os.environ['GH_REPO']
          assert source['path'] == '.github/workflows/ios.yml'
          assert re.fullmatch('[0-9a-f]{40}', source['head_sha'])
          assert any(j['name'] == 'build' and j['conclusion'] == 'success' for j in jobs)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOURCE_SHA=' + source['head_sha'] + '\n')
              output.write('SOURCE_TAG=v0.1.0-amp.' + str(source['run_number']) + '\n')
          PY
      - name: Read the source build's signing declarations
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:Support/Erhu.entitlements" > "$RUNNER_TEMP/amp.entitlements"
          git show "$SOURCE_SHA:Support/ErhuPlayerWidget.entitlements" > "$RUNNER_TEMP/widget.entitlements"
      - uses: actions/download-artifact@v4
        with:
          name: amp-ipa
          path: dist/source
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v5
        with:
          repository: asdfzxcvbn/ipapatch
          ref: 2ccafe4035bcf9fdade17cf32605d532da6cea6a
          path: third_party/ipapatch
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
          cache-dependency-path: third_party/ipapatch/go.sum
      - name: Build the reviewed patcher from pinned source
        working-directory: third_party/ipapatch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IPAPATCH_REVISION"
          test "$(shasum -a 256 resources/zxPluginsInject.dylib | cut -d ' ' -f1)" = "$IPAPATCH_DYLIB_SHA256"
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ipapatch" .
      - name: Patch both app and widget without overwriting the normal IPA
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ipapatch" --input dist/source/amp.ipa --output dist/patched.ipa --noconfirm
          mkdir compat
          unzip -q dist/patched.ipa -d compat
          app=compat/Payload/Erhu.app
          codesign --force --sign - "$app/Frameworks/zxPluginsInject.dylib"
          codesign --force --sign - --generate-entitlement-der --entitlements "$RUNNER_TEMP/widget.entitlements" "$app/PlugIns/ErhuPlayerWidget.appex"
          codesign --force --sign - --generate-entitlement-der --entitlements "$RUNNER_TEMP/amp.entitlements" "$app"
          codesign --verify --deep --strict "$app"
          (cd compat && zip -qry "$GITHUB_WORKSPACE/dist/amp-flarestore.ipa" Payload)
          python3 Tools/verify_flarestore_patch.py dist/source/amp.ipa dist/amp-flarestore.ipa > dist/flarestore-verification.json
          python3 - <<'PY'
          import json, os
          report = json.load(open('dist/flarestore-verification.json'))
          assert report['release'] == os.environ['SOURCE_TAG']
          report['source_commit'] = os.environ['SOURCE_SHA']
          report['ipapatch_commit'] = os.environ['IPAPATCH_REVISION']
          report['injected_dylib_source_sha256'] = os.environ['IPAPATCH_DYLIB_SHA256']
          report['adhoc_signature_verified'] = True
          with open('dist/flarestore-verification.json', 'w') as output:
              json.dump(report, output, indent=2)
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: amp-flarestore-compat
          path: |
            dist/amp-flarestore.ipa
            dist/flarestore-verification.json
          compression-level: 0
          if-no-files-found: error
      - name: Publish the optional compatibility download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$SOURCE_TAG" dist/amp-flarestore.ipa dist/flarestore-verification.json --clobber --repo "$GH_REPO"
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          Optional compatibility copy: app and widget load the pinned ipapatch library. The normal amp.ipa is preserved.
          This is ad-hoc signed for integrity checks, not provisioned for installation. Sign it again in FlareStore, preserving the widget and shared-group permissions. Use the profile App-ID option for the system music opening fix.
          These static checks do not prove on-device widget communication or replace the source build's separate native UI test results.
          TEXT
